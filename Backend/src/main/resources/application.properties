spring.main.allow-circular-references=true
spring.application.name=UrbanTracker

# URL del servidor y base de datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/UrbanTracker

# Usuario y contrasena de la base de datos
spring.datasource.username=postgres
spring.datasource.password=123456

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Ejecutar sentencias DDL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# Configuracion de Hibernate (Manejo de esquema)
spring.jpa.hibernate.ddl-auto=update
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true

# Configuracion especifica de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Crear esquemas automaticamente
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_source=metadata
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_source=metadata

# Puerto del servidor
server.port=8085

# ============================
# MQTT / Mosquitto settings
# ============================
# URL del broker Mosquitto (tcp://host:puerto)
mqtt.broker-url=tcp://localhost:1883
# Identificador del cliente (se agregara un sufijo aleatorio para evitar colisiones)
mqtt.client-id=urbantracker-backend
# Credenciales (opcional)
mqtt.username=
mqtt.password=
# Opciones de conexion
mqtt.clean-session=true
mqtt.automatic-reconnect=true
mqtt.connection-timeout=10
mqtt.keep-alive-interval=20

# Servidor SMTP de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587

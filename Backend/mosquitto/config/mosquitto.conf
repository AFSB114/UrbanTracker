# =============================
# Configuración básica de Mosquitto
# =============================

# Permitir conexiones sin autenticación
allow_anonymous true

# =============================
# MQTT estándar (puerto 1883)
# =============================
listener 1883
protocol mqtt

# =============================
# WebSocket (puerto 9001)
# =============================
listener 9001
protocol websockets

# =============================
# Rutas y logs personalizados
# =============================

# Directorio donde se guardan los datos (persistencia)
persistence true
persistence_location /mosquitto/data/

# Archivo de logs
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true
